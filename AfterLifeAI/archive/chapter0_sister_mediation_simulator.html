<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0챕터 [갑작스러운 중재_1] 메신저 시뮬레이터</title>
    <style>
        :root {
            --bg-color: #090a0f;
            --phone-bg: #12151e;
            --header-bg: #1a1e2b;
            --border-color: #262c3d;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --accent-purple: #c084fc;
            --chat-left: #212636;
            --chat-right: #0284c7;
            --chat-right-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-container {
            width: 100%;
            max-width: 440px;
            height: 750px;
            background: var(--phone-bg);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .phone-header {
            padding: 12px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            border: 2px solid var(--accent-purple);
        }

        .user-details .name {
            font-size: 14.5px;
            font-weight: 700;
        }

        .user-details .sub {
            font-size: 11px;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-restart-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-restart-btn:hover {
            background: var(--accent-cyan);
            color: #090a0f;
        }

        .ai-status-bar {
            background: #10131d;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .suspicion-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .suspicion-value {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 120px;
            height: 6px;
            background: #1e2433;
            border-radius: 3px;
            overflow: hidden;
            margin-left: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 15%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transition: width 0.4s ease;
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .message-bubble.left {
            align-self: flex-start;
            background: var(--chat-left);
            color: var(--text-main);
            border-top-left-radius: 4px;
        }

        .message-bubble.right {
            align-self: flex-end;
            background: var(--chat-right);
            color: var(--chat-right-text);
            border-top-right-radius: 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--chat-left);
            padding: 10px 16px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            display: flex;
            gap: 4px;
            align-items: center;
            margin-bottom: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        .system-log {
            align-self: center;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: var(--accent-cyan);
            font-size: 11.5px;
            padding: 8px 14px;
            border-radius: 20px;
            margin: 6px 0;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }

        /* 채팅 스크롤 내부 맨 밑에 자연스럽게 들어가는 결과 카드 */
        .chat-result-card {
            align-self: center;
            width: 92%;
            background: #151a28;
            border: 1px solid var(--accent-cyan);
            border-radius: 14px;
            padding: 14px;
            margin: 10px 0 6px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease;
        }

        .chat-result-card.gameover {
            border-color: var(--accent-red);
        }

        .result-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-green);
            margin-bottom: 6px;
        }

        .chat-result-card.gameover .result-title {
            color: var(--accent-red);
        }

        .result-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .inline-restart-btn {
            background: var(--accent-cyan);
            color: #090a0f;
            font-weight: bold;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .inline-restart-btn:hover {
            background: #7dd3fc;
        }

        .interactive-tag {
            color: var(--accent-cyan);
            text-decoration: underline;
            font-weight: bold;
        }

        /* 하단 선택지 영역 */
        .choice-container {
            padding: 12px 14px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 65px;
            justify-content: center;
        }

        .choice-btn {
            background: #23293a;
            border: 1px solid #323a52;
            color: var(--text-main);
            padding: 11px 15px;
            border-radius: 10px;
            font-size: 13.5px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: #2d354a;
            border-color: var(--accent-cyan);
        }

        .bottom-status-msg {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 상단 헤더: 고정 [처음부터] 다시 시작 버튼 -->
    <div class="phone-header">
        <div class="user-info">
            <div class="avatar">지원</div>
            <div class="user-details">
                <div class="name">박지원 (여동생)</div>
                <div class="sub">온라인</div>
            </div>
        </div>
        <button class="header-restart-btn" onclick="resetGame()">🔄 처음부터</button>
    </div>

    <!-- AI 의심 수치 바 -->
    <div class="ai-status-bar">
        <span class="suspicion-label">의심 수치 (Risk Level)</span>
        <div style="display: flex; align-items: center;">
            <span class="suspicion-value" id="suspicion-text">15%</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="suspicion-bar"></div>
            </div>
        </div>
    </div>

    <!-- 스크롤 가능한 대화 영역 -->
    <div class="chat-area" id="chat-area"></div>

    <!-- 하단 선택지 영역 -->
    <div class="choice-container" id="choice-container"></div>
</div>

<script>
    let state = { suspicion: 15 };

    const script = [
        {
            sender: "left",
            text: "오빠 가은이 언니한테 연락 왔는데?",
            delay: 800
        },
        {
            sender: "left",
            text: "언니가 오빠 혹시 자기한테 뭐 삐친 거 있냐고 물어보잖아 ㅋㅋㅋ 답장 왜 그따구로 보냈어?",
            delay: 1000,
            choices: [
                { text: "1. 무슨 소리야?", suspicionDelta: 0 }
            ]
        },
        {
            sender: "left",
            text: "아까 언니랑 연락했다며. 말투 존나 딱딱하고 낯설어서 자기한테 화난 줄 알았대.",
            delay: 1000
        },
        {
            sender: "left",
            text: "아무리 가은이 언니가 장기 프로젝트 때문에 오랫동안 연락 끊겼었다지만, 그래도 오빠 연인이잖아. 연인 사이에 좀 잘 좀 해라.",
            delay: 1200,
            systemLog: "💡 <strong>AI 데이터 갱신:</strong> '윤가은' - 박지훈의 연인 / 최근 장기 프로젝트로 연락 두절되었음"
        },
        {
            sender: "left",
            text: "오랫동안 연락 안 돼서 오빠 서운했던 건 알겠는데, 그렇다고 그렇게 차갑게 굴 일이야? 언니도 일 때문에 어쩔 수 없었던 건데.",
            delay: 1000
        },
        {
            sender: "left",
            text: "대충 \"연락 오랫동안 안 돼서 좀 삐쳤었다, 미안하다\" 식으로 둘러대고 답장 다시 예쁘게 보내.",
            delay: 1000
        },
        {
            sender: "left",
            text: "언니 지금 오빠 변한 것 같다고 진지하게 의심하고 있으니까 분위기 잘 풀어봐. 알았지?",
            delay: 1200,
            choices: [
                { text: "2. 뭐라고 답장해야 하지?", suspicionDelta: 10 }
            ]
        },
        {
            sender: "left",
            text: "아 휴가 나와서 머리 리셋됐냐?",
            delay: 900
        },
        {
            sender: "left",
            text: "오빠 피드 옛날 거 좀 찾아보든가, 언니 계정(<span class='interactive-tag'>@gaeun_y</span>) 가서 둘이 같이 찍은 사진이나 커플 태그 같은 거 보고 분위기 맞추라고.",
            delay: 1400,
            systemLog: "🎯 <strong>튜토리얼 완료:</strong> 피드 검색 및 프로필 이동 기능 안내 받음",
            isEnd: true
        }
    ];

    let currentIdx = 0;

    function updateSuspicion(delta) {
        state.suspicion = Math.max(0, Math.min(100, state.suspicion + delta));
        document.getElementById('suspicion-bar').style.width = state.suspicion + '%';
        document.getElementById('suspicion-text').innerText = state.suspicion + '%';

        if (state.suspicion >= 100) {
            triggerGameOver();
        }
    }

    function appendMessage(sender, text, systemLog) {
        const chatArea = document.getElementById('chat-area');

        if (systemLog) {
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-log';
            sysDiv.innerHTML = systemLog;
            chatArea.appendChild(sysDiv);
        }

        if (text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message-bubble ${sender}`;
            msgDiv.innerHTML = text;
            chatArea.appendChild(msgDiv);
        }

        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTypingIndicator(callback) {
        const chatArea = document.getElementById('chat-area');
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.id = 'temp-typing';
        typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        chatArea.appendChild(typing);
        chatArea.scrollTop = chatArea.scrollHeight;

        setTimeout(() => {
            const temp = document.getElementById('temp-typing');
            if (temp) temp.remove();
            callback();
        }, 600);
    }

    function stepGame() {
        if (currentIdx >= script.length) return;

        const currentMsg = script[currentIdx];

        if (currentMsg.sender === "left") {
            showTypingIndicator(() => {
                appendMessage(currentMsg.sender, currentMsg.text, currentMsg.systemLog);

                if (currentMsg.choices) {
                    renderChoices(currentMsg.choices);
                } else if (currentMsg.isEnd) {
                    setTimeout(triggerChapterClear, 1000);
                } else {
                    currentIdx++;
                    setTimeout(stepGame, currentMsg.delay || 800);
                }
            });
        }
    }

    function renderChoices(choices) {
        const choiceContainer = document.getElementById('choice-container');
        choiceContainer.innerHTML = '';

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span>${choice.text}</span> <span style="font-size:11px; color:var(--accent-cyan);">전송 💬</span>`;
            btn.onclick = () => {
                choiceContainer.innerHTML = '<div class="bottom-status-msg">상대방이 메시지를 입력 중입니다...</div>';
                appendMessage('right', choice.text);
                updateSuspicion(choice.suspicionDelta);
                currentIdx++;
                setTimeout(stepGame, 600);
            };
            choiceContainer.appendChild(btn);
        });
    }

    function triggerGameOver() {
        const chatArea = document.getElementById('chat-area');
        const card = document.createElement('div');
        card.className = 'chat-result-card gameover';
        card.innerHTML = `
            <div class="result-title">🚨 GAME OVER - 정체 발각</div>
            <div class="result-desc">의심 수치가 100%에 도달했습니다. 어색한 반응으로 인해 정체가 발각되었습니다.</div>
            <button class="inline-restart-btn" onclick="resetGame()">🔄 시뮬레이터 다시 시작</button>
        `;
        chatArea.appendChild(card);
        chatArea.scrollTop = chatArea.scrollHeight;

        document.getElementById('choice-container').innerHTML = `<div class="bottom-status-msg">대화가 종료되었습니다. 상단 또는 위의 [다시 시작] 버튼을 누르세요.</div>`;
    }

    function triggerChapterClear() {
        const chatArea = document.getElementById('chat-area');
        const card = document.createElement('div');
        card.className = 'chat-result-card';
        card.innerHTML = `
            <div class="result-title">🎉 CHAPTER 0 CLEARED</div>
            <div class="result-desc">지원의 조언으로 윤가은의 의심을 모면할 구실("서운해서 삐침")을 마련했습니다.</div>
            <button class="inline-restart-btn" onclick="resetGame()">🔄 시뮬레이터 다시 시작</button>
        `;
        chatArea.appendChild(card);
        chatArea.scrollTop = chatArea.scrollHeight;

        document.getElementById('choice-container').innerHTML = `<div class="bottom-status-msg">대화가 종료되었습니다. 상단 또는 위의 [다시 시작] 버튼을 누르세요.</div>`;
    }

    function resetGame() {
        location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(stepGame, 300);
    });
</script>

</body>
</html>
