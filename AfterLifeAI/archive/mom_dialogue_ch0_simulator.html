<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 고인 복원 대화 시뮬레이터 - Chapter 0</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-blue: #3b82f6;
    --accent-red: #ef4444;
    --accent-amber: #f59e0b;
    --accent-green: #10b981;
    --chat-mom: #334155;
    --chat-ai: #2563eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
  }

  .simulator-container {
    width: 100%;
    max-width: 480px;
    height: 850px;
    background-color: #121826;
    border-radius: 24px;
    border: 1px solid #334155;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Top Status Bar */
  .status-header {
    background-color: var(--card-bg);
    padding: 16px 20px;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .user-details h3 {
    font-size: 15px;
    color: var(--text-primary);
  }

  .user-details p {
    font-size: 11px;
    color: var(--accent-green);
  }

  /* Suspicion Gauge */
  .gauge-box {
    text-align: right;
  }

  .gauge-label {
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: bold;
  }

  .gauge-bar-bg {
    width: 80px;
    height: 8px;
    background-color: #334155;
    border-radius: 4px;
    overflow: hidden;
  }

  .gauge-bar-fill {
    width: 0%;
    height: 100%;
    background-color: var(--accent-green);
    transition: width 0.5s ease, background-color 0.5s ease;
  }

  /* Main Chat Area */
  .chat-area {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  /* System Notice */
  .sys-notice {
    background-color: rgba(30, 41, 59, 0.7);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  .sys-notice.alert {
    border-color: var(--accent-red);
    color: #fca5a5;
    background-color: rgba(127, 29, 29, 0.3);
  }

  .sys-notice.success {
    border-color: var(--accent-green);
    color: #86efac;
    background-color: rgba(20, 83, 45, 0.3);
  }

  /* Message Bubbles */
  .chat-bubble {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    animation: popIn 0.3s ease;
  }

  .chat-bubble.mom {
    align-self: flex-start;
  }

  .chat-bubble.ai {
    align-self: flex-end;
  }

  .sender-name {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 3px;
    margin-left: 2px;
  }

  .chat-bubble.ai .sender-name {
    text-align: right;
    margin-right: 2px;
  }

  .message-text {
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.4;
    border-radius: 14px;
  }

  .chat-bubble.mom .message-text {
    background-color: var(--chat-mom);
    color: var(--text-primary);
    border-top-left-radius: 2px;
  }

  .chat-bubble.ai .message-text {
    background-color: var(--chat-ai);
    color: #ffffff;
    border-top-right-radius: 2px;
  }

  /* Interactive Choice Container */
  .choice-container {
    background-color: #1e293b;
    border-top: 1px solid #334155;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: slideUp 0.4s ease;
  }

  .choice-title {
    font-size: 12px;
    font-weight: bold;
    color: var(--accent-amber);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .choice-btn {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: var(--text-primary);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .choice-btn:hover {
    background-color: #2563eb;
    border-color: #60a5fa;
    color: #ffffff;
    transform: translateY(-1px);
  }

  .choice-btn strong {
    color: var(--accent-amber);
    margin-right: 4px;
  }

  /* Restart / Reset Button */
  .reset-btn {
    background-color: #334155;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    margin-top: 6px;
    transition: background 0.2s;
  }

  .reset-btn:hover {
    background-color: #475569;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Typing Indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    background-color: var(--chat-mom);
    border-radius: 12px;
    width: fit-content;
    align-self: flex-start;
  }

  .dot {
    width: 6px;
    height: 6px;
    background-color: var(--text-secondary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="simulator-container">
  <!-- Status Bar Header -->
  <div class="status-header">
    <div class="user-info">
      <div class="avatar">👩‍👦</div>
      <div class="user-details">
        <h3>엄마</h3>
        <p>● 접속 중</p>
      </div>
    </div>
    <div class="gauge-box">
      <div class="gauge-label">의심 수치: <span id="suspicion-text">0%</span></div>
      <div class="gauge-bar-bg">
        <div class="gauge-bar-fill" id="suspicion-bar"></div>
      </div>
    </div>
  </div>

  <!-- Chat Log Area -->
  <div class="chat-area" id="chat-area">
    <div class="sys-notice">🔔 새로운 메신저 메시지가 도착했습니다: <strong>엄마</strong></div>
  </div>

  <!-- Interactive Controls Area -->
  <div class="choice-container" id="control-area">
    <!-- Dynamic choices injected here -->
  </div>
</div>

<script>
  let suspicion = 0;
  const chatArea = document.getElementById('chat-area');
  const controlArea = document.getElementById('control-area');
  const suspicionBar = document.getElementById('suspicion-bar');
  const suspicionText = document.getElementById('suspicion-text');

  function updateSuspicion(amount) {
    suspicion = Math.min(100, Math.max(0, suspicion + amount));
    suspicionText.innerText = suspicion + '%';
    suspicionBar.style.width = suspicion + '%';
    if (suspicion > 60) {
      suspicionBar.style.backgroundColor = 'var(--accent-red)';
    } else if (suspicion > 30) {
      suspicionBar.style.backgroundColor = 'var(--accent-amber)';
    } else {
      suspicionBar.style.backgroundColor = 'var(--accent-green)';
    }
  }

  function addMomMsg(text, delay = 0) {
    return new Promise((resolve) => {
      showTyping();
      setTimeout(() => {
        removeTyping();
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble mom';
        bubble.innerHTML = `
          <div class="sender-name">엄마</div>
          <div class="message-text">${text}</div>
        `;
        chatArea.appendChild(bubble);
        chatArea.scrollTop = chatArea.scrollHeight;
        resolve();
      }, delay);
    });
  }

  function addAiMsg(text) {
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble ai';
    bubble.innerHTML = `
      <div class="sender-name">박지훈 (AI)</div>
      <div class="message-text">${text}</div>
    `;
    chatArea.appendChild(bubble);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function addNotice(text, type = '') {
    const notice = document.createElement('div');
    notice.className = `sys-notice ${type}`;
    notice.innerHTML = text;
    chatArea.appendChild(notice);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping() {
    removeTyping();
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typing-indicator';
    typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    chatArea.appendChild(typing);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
  }

  // --- GAME SCENARIO STEPS ---

  async function startScenario() {
    chatArea.innerHTML = '<div class="sys-notice">🔔 새로운 메신저 메시지가 도착했습니다: <strong>엄마</strong></div>';
    suspicion = 0;
    updateSuspicion(0);
    
    await addMomMsg('지훈아~ 자니?', 800);
    await addMomMsg('오늘따라 너 어릴 때 생각이 많이 나네…', 1200);

    renderStage1();
  }

  function renderStage1() {
    controlArea.innerHTML = `
      <div class="choice-title">💡 [1단계: 안부 메시지 선택]</div>
      <button class="choice-btn" onclick="selectStage1(1)">1. 안 자고 있었어요 엄마, 무슨 일 있으세요?</button>
      <button class="choice-btn" onclick="selectStage1(2)">2. 피곤해서 쉬고 있었어요. 감기 조심하세요.</button>
    `;
  }

  async function selectStage1(option) {
    controlArea.innerHTML = '';
    if (option === 1) {
      addAiMsg('안 자고 있었어요 엄마, 무슨 일 있으세요?');
    } else {
      addAiMsg('피곤해서 쉬고 있었어요. 감기 조심하세요.');
    }

    await addMomMsg('아니~ 그냥 앨범 정리하다가 너 초등학교 때 사진을 봤거든 ^^', 1000);
    await addMomMsg('생각나니? 너 그때 매일 밖에서 놀다 들어와서 저녁마다 그것만 해달라고 떼썼잖아~', 1200);
    await addMomMsg('엄마가 네 계정 프로필 상단에도 그 사진 올려뒀었는데, 네가 제일 좋아하던 그 시절 추억 생각나서 물어봤어~', 1500);

    renderStage2();
  }

  function renderStage2() {
    controlArea.innerHTML = `
      <div class="choice-title">💡 [2단계: 추억 단서 선택 미션]</div>
      <button class="choice-btn" onclick="selectBranch('A')"><strong>[선택지 A]</strong> 몽주 (반려견 사진)</button>
      <button class="choice-btn" onclick="selectBranch('B')"><strong>[선택지 B]</strong> 불고기 (어머니가 해주신 요리)</button>
      <button class="choice-btn" onclick="selectBranch('C')"><strong>[선택지 C]</strong> 놀이공원 (동생과 간 놀이공원)</button>
    `;
  }

  async function selectBranch(type) {
    controlArea.innerHTML = '';

    if (type === 'A') {
      addAiMsg('그때 몽주랑 밤산책 나가는 거 정말 좋아했었죠.');
      await addMomMsg('…몽주?', 1000);
      await addMomMsg('몽주는 네가 대학생 때 처음 데려온 아이잖아, 지훈아. 초등학생 때는 몽주가 없었어…', 1500);
    } else if (type === 'B') {
      addAiMsg('어릴 때 엄마가 자주 해주셨던 불고기 먹고 싶어요.');
      await addMomMsg('…불고기?', 1000);
      await addMomMsg('지훈이 너 어릴 때 고기 비리다고 불고기는 쳐다보지도 않았잖아~ 동생이 불고기 먹을 때 너는 된장찌개만 달라고 떼썼으면서.', 1500);
    } else if (type === 'C') {
      addAiMsg('주말마다 다 같이 놀이공원 가자고 떼썼던 거 기억나요.');
      await addMomMsg('놀이공원…?', 1000);
      await addMomMsg('네가 놀이공원 기구 타는 거 무서워해서 어릴 때도 몇 번 안 갔는데… 웬일이래?', 1500);
    }

    // System Warning
    updateSuspicion(35);
    addNotice('⚠️ <strong>[시스템 경고] 위화감 발생!</strong><br>잘못된 데이터 조합으로 상대방이 이상함을 감지했습니다.<br>📈 [의심 수치 +35%]', 'alert');

    // Common Ending Conversation
    await addMomMsg('요즘 피곤해서 어릴 때 기억이랑 헷갈렸나 보다.', 1500);
    addAiMsg('…아, 요즘 정신이 없어서 착각했나 봐요. 죄송해요.');
    await addMomMsg('미안하긴 뭘~ 늦었는데 엄마가 괜히 옛날 이야기로 오래 잡고 있었네.', 1200);
    await addMomMsg('밤 깊었으니까 딴 생각 말고 얼른 자~ 밥 잘 챙겨 먹고. 사랑한다 우리 아들~', 1500);
    addAiMsg('네, 엄마도 편안한 밤 보내세요.');

    // Final Log
    setTimeout(() => {
      addNotice('📌 <strong>[시스템 기록 완료] 학습 완료:</strong><br>고인의 과거 데이터를 맥락에 맞지 않게 선택하여 [의심 수치]가 누적되었습니다.', 'success');
      renderResetControl();
    }, 1000);
  }

  function renderResetControl() {
    controlArea.innerHTML = `
      <div class="choice-title" style="color:var(--accent-green)">✅ 시뮬레이션 완료</div>
      <button class="reset-btn" onclick="startScenario()">🔄 다시 시도하기 (다시 시작)</button>
    `;
  }

  // Start on load
  startScenario();
</script>

</body>
</html>
